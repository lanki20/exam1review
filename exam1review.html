                options: ["賀", "惹", "憂", "憤"],
                explanation: "「惹」、「憂」、「憤」皆為心部，「賀」為貝部。"
            },
            {
                question: "他突如其來的滑稽演出，惹得全場觀眾□□□□。",
                correctAnswer: "哄堂大笑",
                options: ["哄堂大笑", "從容不迫", "溫故知新", "適可而止"],
                explanation: "滑稽演出會讓全場同時大笑，故填入「哄堂大笑」。"
            },
            {
                question: "當雙方各持己見、相持不下，局面沒有進展，這種情況可以用哪一個語詞來形容？",
                correctAnswer: "僵持",
                options: ["僵持", "僵冷", "僵硬", "凍僵"],
                explanation: "相持不下、無進展的局面稱為「僵持」。"
            },
            {
                question: "下面哪一個「 」中的語詞使用錯誤？",
                correctAnswer: "謠言已經四處「擴張」，他們趕緊出面澄清",
                options: ["謠言已經四處「擴張」，他們趕緊出面澄清", "睡夢中，我依稀聽見風的聲音", "她喜歡閱讀科學雜誌，探索宇宙的奧妙", "對於網路資訊，我們要保持警惕"],
                explanation: "謠言應該是四處「擴散」，而非擴張。"
            },
            {
                question: "《樹的聯想》一課中，作者認為種樹的人始料未及的事是什麼？",
                correctAnswer: "無意間帶給別人快樂",
                options: ["無意間帶給別人快樂", "當成市區的行道樹", "要經過多年才能長成", "沒有人會去注意"],
                explanation: "種樹者可能沒想到這棵樹能為路人帶來心靈的撫慰與快樂。"
            }
        ];

        // 打亂陣列的函數 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let currentQuiz1Data = [];
        let currentQuiz2Data = [];

        // 初始化與渲染測驗 1
        function initQuiz1() {
            // 每次重新測驗強制設定標題
            document.getElementById('main-title').textContent = '604上學期段一國複習';
            document.title = '604上學期段一國複習';

            // 深拷貝並打亂題目與選項
            currentQuiz1Data = shuffleArray(JSON.parse(JSON.stringify(rawQuiz1Data))).map(q => {
                q.options = shuffleArray(q.options);
                return q;
            });
            renderQuestions(currentQuiz1Data, 'quiz1-questions', 'q1');
            
            // 重置 UI
            document.getElementById('quiz1-score-container').classList.add('hidden');
            document.getElementById('quiz1-submit-btn').classList.remove('hidden');
            document.getElementById('quiz1-retry-btn').classList.add('hidden');
            document.getElementById('quiz1-form').reset();
        }

        // 初始化與渲染測驗 2
        function initQuiz2() {
            // 每次重新測驗強制設定標題
            document.getElementById('main-title').textContent = '604上學期段一國複習';
            document.title = '604上學期段一國複習';

            // 深拷貝並打亂題目與選項
            currentQuiz2Data = shuffleArray(JSON.parse(JSON.stringify(rawQuiz2Data))).map(q => {
                q.options = shuffleArray(q.options);
                return q;
            });
            renderQuestions(currentQuiz2Data, 'quiz2-questions', 'q2');
            
            // 重置 UI
            document.getElementById('quiz2-score-container').classList.add('hidden');
            document.getElementById('quiz2-submit-btn').classList.remove('hidden');
            document.getElementById('quiz2-retry-btn').classList.add('hidden');
            document.getElementById('quiz2-form').reset();
        }

        // 切換頁籤邏輯
        function switchTab(tabIndex) {
            const btn1 = document.getElementById('btn-tab1');
            const btn2 = document.getElementById('btn-tab2');
            const section1 = document.getElementById('quiz1-section');
            const section2 = document.getElementById('quiz2-section');

            if (tabIndex === 1) {
                btn1.className = "tab-active px-4 sm:px-6 py-3 focus:outline-none text-base sm:text-lg transition-colors whitespace-nowrap";
                btn2.className = "tab-inactive px-4 sm:px-6 py-3 focus:outline-none text-base sm:text-lg transition-colors whitespace-nowrap";
                section1.classList.remove('hidden');
                section2.classList.add('hidden');
            } else {
                btn2.className = "tab-active px-4 sm:px-6 py-3 focus:outline-none text-base sm:text-lg transition-colors whitespace-nowrap";
                btn1.className = "tab-inactive px-4 sm:px-6 py-3 focus:outline-none text-base sm:text-lg transition-colors whitespace-nowrap";
                section2.classList.remove('hidden');
                section1.classList.add('hidden');
            }
        }

        // 動態渲染題目
        function renderQuestions(data, containerId, prefix) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            data.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'bg-white p-5 sm:p-6 rounded-lg border border-gray-200 shadow-sm transition-all duration-300';
                questionDiv.id = `${prefix}_question_div_${index}`;

                // 題幹
                const title = document.createElement('h3');
                title.className = 'text-lg font-bold text-gray-800 mb-4 leading-relaxed';
                title.textContent = `${index + 1}. ${q.question}`;
                questionDiv.appendChild(title);

                // 選項區塊
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';

                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    label.className = 'relative flex items-center cursor-pointer';

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `${prefix}_q${index}`;
                    radio.value = opt; // 綁定文字內容作為答案，方便打亂後比對
                    radio.required = true;
                    radio.className = 'radio-custom absolute opacity-0 w-0 h-0';

                    const customDiv = document.createElement('div');
                    customDiv.className = 'w-full p-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-blue-50 transition-colors font-medium text-base';
                    customDiv.textContent = opt;

                    label.appendChild(radio);
                    label.appendChild(customDiv);
                    optionsDiv.appendChild(label);
                });
                questionDiv.appendChild(optionsDiv);

                // 檢討區 (預設隱藏)
                const reviewDiv = document.createElement('div');
                reviewDiv.id = `${prefix}_review${index}`;
                reviewDiv.className = 'hidden mt-4 pt-4 border-t border-gray-200';
                questionDiv.appendChild(reviewDiv);

                container.appendChild(questionDiv);
            });
        }

        // 計算分數與顯示檢討 (並將錯題移至最前)
        function handleQuizSubmit(e, data, formId, prefix, scoreContainerId, submitBtnId, retryBtnId) {
            e.preventDefault();
            const form = document.getElementById(formId);
            let correctCount = 0;
            const totalCount = data.length;
            const eachScore = 100 / totalCount;

            const containerId = formId.replace('-form', '-questions');
            const container = document.getElementById(containerId);
            const questionNodes = Array.from(container.children);
            const wrongNodes = [];
            const correctNodes = [];

            data.forEach((q, index) => {
                const selectedRadio = form.querySelector(`input[name="${prefix}_q${index}"]:checked`);
                const reviewDiv = document.getElementById(`${prefix}_review${index}`);
                reviewDiv.classList.remove('hidden');

                const isCorrect = selectedRadio && selectedRadio.value === q.correctAnswer;
                
                // 找出所有選項，標示顏色並禁用
                const radios = form.querySelectorAll(`input[name="${prefix}_q${index}"]`);
                radios.forEach(r => {
                    r.disabled = true; 
                    if (r.value === q.correctAnswer) {
                        // 正確答案用綠色標示
                        r.nextElementSibling.classList.add('ring-2', 'ring-green-500', 'border-green-500', 'bg-green-50', 'text-green-800', 'font-bold');
                    }
                });

                if (isCorrect) {
                    correctCount++;
                    reviewDiv.innerHTML = `
                        <div class="text-gray-700 font-semibold tracking-wide text-base">
                            詳解：${q.explanation}
                        </div>
                    `;
                    correctNodes.push(questionNodes[index]);
                } else {
                    if (selectedRadio) {
                        // 學生選錯的答案用紅色標示
                        selectedRadio.nextElementSibling.classList.add('ring-2', 'ring-red-500', 'border-red-500', 'bg-red-50', 'text-red-800', 'font-bold');
                    }
                    reviewDiv.innerHTML = `
                        <div class="text-gray-700 font-semibold tracking-wide text-base">
                            詳解：${q.explanation}
                        </div>
                    `;
                    // 錯題加上明顯的紅色邊框，方便視覺辨識
                    questionNodes[index].classList.remove('border-gray-200');
                    questionNodes[index].classList.add('border-red-300', 'bg-red-50/30');
                    wrongNodes.push(questionNodes[index]);
                }
            });

            // 將錯題集中移到最前面
            container.innerHTML = '';
            wrongNodes.forEach(node => container.appendChild(node));
            correctNodes.forEach(node => container.appendChild(node));

            // 隱藏送出按鈕，顯示重新測驗按鈕
            document.getElementById(submitBtnId).classList.add('hidden');
            document.getElementById(retryBtnId).classList.remove('hidden');

            // 計算分數與呈現
            const score = Math.round(correctCount * eachScore);
            const scoreContainer = document.getElementById(scoreContainerId);
            scoreContainer.classList.remove('hidden');
            
            let scoreColor = score >= 80 ? 'text-green-600' : (score >= 60 ? 'text-blue-600' : 'text-red-600');
            
            scoreContainer.innerHTML = `
                <h2 class="text-4xl font-extrabold ${scoreColor} mb-3">本次測驗成績：${score} 分</h2>
                <p class="text-lg text-gray-700 font-medium">共 ${totalCount} 題，您答對了 <span class="text-green-600 font-bold text-xl">${correctCount}</span> 題</p>
                <div class="mt-4 inline-block bg-yellow-100 text-yellow-800 px-4 py-2 rounded-full text-sm font-bold shadow-sm border border-yellow-200">
                    ⭐ 錯題已為您移至最前方，請往下查看正確解答與詳解
                </div>
            `;
            
            // 平滑滾動到成績處
            document.getElementById('main-scroll').scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 綁定表單送出事件
        document.getElementById('quiz1-form').addEventListener('submit', function(e) {
            handleQuizSubmit(e, currentQuiz1Data, 'quiz1-form', 'q1', 'quiz1-score-container', 'quiz1-submit-btn', 'quiz1-retry-btn');
        });

        document.getElementById('quiz2-form').addEventListener('submit', function(e) {
            handleQuizSubmit(e, currentQuiz2Data, 'quiz2-form', 'q2', 'quiz2-score-container', 'quiz2-submit-btn', 'quiz2-retry-btn');
        });

        // 初始化頁面
        window.onload = function() {
            initQuiz1();
            initQuiz2();
        };

    </script>
</body>
</html>
